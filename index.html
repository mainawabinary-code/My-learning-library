<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#17202a"><title>My Learning Library</title>
<style>
body{margin:0;font-family:system-ui;background:#f4f6f8;color:#17202a}header{background:#17202a;color:white;padding:18px}main{max-width:900px;margin:auto;padding:15px}
.panel,.card,.box{background:white;border-radius:15px;padding:15px;margin-bottom:15px;box-shadow:0 2px 10px #0001}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #ccd3da;border-radius:9px;box-sizing:border-box}textarea{min-height:100px}
button{background:#2563eb;color:white;border:0;border-radius:9px;padding:10px 13px;margin:3px;font-weight:600}.gray{background:#475569}.red{background:#dc2626}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:15px}.card{padding:0;overflow:hidden}.body{padding:13px}.thumbs{display:grid;grid-template-columns:repeat(2,1fr);gap:2px}.thumbs img{width:100%;height:115px;object-fit:cover}
.lesson{border:1px solid #ddd;border-radius:11px;padding:11px;margin:9px 0}.lesson p{white-space:pre-wrap}.pics{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.pics img{width:100%;height:75px;object-fit:cover;border-radius:6px}
.modal,.viewer{display:none;position:fixed;inset:0;background:#000b;z-index:10;align-items:center;justify-content:center;padding:15px}.box{width:min(650px,100%);max-height:90vh;overflow:auto}.viewer img{max-width:94%;max-height:80%}.x{position:absolute;right:12px;top:8px;background:transparent;font-size:42px}.nav{position:absolute;bottom:15px}.count{position:absolute;bottom:62px;color:white}.preview{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.preview img{width:100%;height:70px;object-fit:cover}
</style></head><body>
<header><h1>📚 My Learning Library</h1><div>Organize topics into daily lessons.</div></header><main>
<section class="panel"><h2>Create topic</h2><input id="topicName" placeholder="e.g. ETF Arbitrage"><select id="topicCat"><option>Programming</option><option>Finance</option><option>AI</option><option>Trading</option><option>Other</option></select><button id="create">➕ Create topic</button></section>
<section class="panel"><input id="search" placeholder="🔎 Search topics"><select id="filter"><option value="">All categories</option><option>Programming</option><option>Finance</option><option>AI</option><option>Trading</option><option>Other</option></select></section>
<div id="grid"></div></main>

<div id="topicModal" class="modal"><div class="box"><h2 id="topicTitle"></h2><button id="addLesson">➕ Add lesson</button><div id="lessons"></div><button class="gray" id="closeTopic">Close</button></div></div>
<div id="lessonModal" class="modal"><div class="box"><h2>Add lesson</h2><b id="lessonTopic"></b><input id="lessonName" placeholder="Lesson title"><textarea id="lessonNotes" placeholder="What did you learn today? (optional)"></textarea><b>Screenshots (optional)</b><input id="lessonFiles" type="file" accept="image/*" multiple><div id="preview" class="preview"></div><button id="saveLesson">Save lesson</button><button class="gray" id="cancelLesson">Cancel</button></div></div>
<div id="viewer" class="viewer"><button id="closeViewer" class="x">×</button><img id="big"><div id="count" class="count"></div><div class="nav"><button id="prev">← Previous</button><button id="next">Next →</button></div></div>

<script>
const DB="learning-library-v2";let db,items=[],active=null,imgs=[],pos=0;
const req=indexedDB.open(DB,1);req.onupgradeneeded=e=>e.target.result.createObjectStore("items",{keyPath:"id",autoIncrement:true});req.onsuccess=e=>{db=e.target.result;load()};
const store=(m="readonly")=>db.transaction("items",m).objectStore("items");
function load(){store().getAll().onsuccess=e=>{items=e.target.result.sort((a,b)=>b.id-a.id);migrate();render()}}
function migrate(){let changed=false;items.forEach(x=>{if(!x.lessons){x.lessons=[{id:Date.now()+Math.random(),title:x.title||"First lesson",notes:"",images:x.images||[],date:x.date||""}];delete x.images;changed=true}});if(changed){let s=store("readwrite");items.forEach(x=>s.put(x))}}
function files(fs){return Promise.all([...fs].map(f=>new Promise(r=>{let x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)})))}
function esc(s){let d=document.createElement("div");d.textContent=s||"";return d.innerHTML}
function render(){let q=search.value.toLowerCase(),f=filter.value,a=items.filter(x=>(!q||x.title.toLowerCase().includes(q))&&(!f||x.category==f));grid.innerHTML=a.length?a.map(x=>{let p=x.lessons.flatMap(l=>l.images||[]).slice(0,4);return `<article class="card"><div class="thumbs">${p.length?p.map(i=>`<img src="${i}">`).join(""):'<div style="height:115px;text-align:center;padding-top:20px">📝<br>No pictures</div>'}</div><div class="body"><h3>${esc(x.title)}</h3><small>${esc(x.category)} • ${x.lessons.length} lesson${x.lessons.length==1?"":"s"}</small><br><button data-open="${x.id}">📖 Open</button><button data-add="${x.id}">➕ Add lesson</button></div></article>`}).join(""):'<div class="panel">No topics yet.</div>'}
create.onclick=()=>{let n=topicName.value.trim();if(!n)return alert("Enter a topic name.");store("readwrite").add({title:n,category:topicCat.value,lessons:[],date:new Date().toLocaleDateString()}).onsuccess=()=>{topicName.value="";load()}}
search.oninput=render;filter.onchange=render;
grid.onclick=e=>{let o=e.target.closest("[data-open]"),a=e.target.closest("[data-add]");if(o)openTopic(+o.dataset.open);if(a)openLesson(+a.dataset.add)}
function openTopic(id){active=items.find(x=>x.id==id);topicTitle.textContent="📖 "+active.title;drawLessons();topicModal.style.display="flex"}
function drawLessons(){lessons.innerHTML=active.lessons.length?active.lessons.map((l,i)=>`<div class="lesson"><h3>${esc(l.title||"Lesson")}</h3><small>${esc(l.date||"")}</small>${l.notes?`<p>${esc(l.notes)}</p>`:""}${(l.images||[]).length?`<div class="pics">${l.images.map((im,n)=>`<img src="${im}" data-img="${i}" data-pos="${n}">`).join("")}</div>`:""}<button class="red" data-del="${i}">Delete lesson</button></div>`).join(""):'<p>No lessons yet. Add your first lesson.</p>'}
addLesson.onclick=()=>openLesson(active.id);closeTopic.onclick=()=>topicModal.style.display="none";
function openLesson(id){active=items.find(x=>x.id==id);lessonTopic.textContent="Topic: "+active.title;lessonName.value="";lessonNotes.value="";lessonFiles.value="";preview.innerHTML="";lessonModal.style.display="flex"}
lessonFiles.onchange=()=>{preview.innerHTML="";[...lessonFiles.files].forEach(f=>{let i=document.createElement("img");i.src=URL.createObjectURL(f);preview.appendChild(i)})}
saveLesson.onclick=()=>{let n=lessonName.value.trim()||"Lesson "+(active.lessons.length+1);files(lessonFiles.files).then(im=>{active.lessons.push({id:Date.now()+Math.random(),title:n,notes:lessonNotes.value.trim(),images:im,date:new Date().toLocaleDateString()});return new Promise(r=>store("readwrite").put(active).onsuccess=r)}).then(()=>{lessonModal.style.display="none";load();openTopic(active.id)})}
cancelLesson.onclick=()=>lessonModal.style.display="none";
lessons.onclick=e=>{let im=e.target.closest("[data-img]"),d=e.target.closest("[data-del]");if(im){let l=active.lessons[+im.dataset.img];imgs=l.images;pos=+im.dataset.pos;show()}if(d&&confirm("Delete this lesson?")){active.lessons.splice(+d.dataset.del,1);store("readwrite").put(active).onsuccess=()=>{load();openTopic(active.id)}}}
function show(){big.src=imgs[pos];count.textContent=(pos+1)+" / "+imgs.length;viewer.style.display="flex"}
closeViewer.onclick=()=>viewer.style.display="none";prev.onclick=()=>{pos=(pos-1+imgs.length)%imgs.length;show()};next.onclick=()=>{pos=(pos+1)%imgs.length;show()};render();
</script></body></html>
