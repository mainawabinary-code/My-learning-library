<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#17202a"><title>My Learning Library</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#f4f6f8;color:#17202a}header{background:#17202a;color:white;padding:20px 16px}main{max-width:900px;margin:auto;padding:16px}h1{margin:0;font-size:24px}header p{margin:5px 0;color:#cbd5e1}.panel,.card{background:white;border-radius:16px;box-shadow:0 2px 12px #0001}.panel{padding:16px;margin-bottom:16px}input,select,button{font:inherit}input,select{width:100%;padding:12px;border:1px solid #ccd3da;border-radius:10px;margin:7px 0 12px}input[type=file]{padding:9px;background:#f8fafc}button{border:0;border-radius:10px;padding:12px 16px;background:#2563eb;color:white;font-weight:600}.danger{background:#dc2626}.preview{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 12px}.preview img{width:100%;height:100px;object-fit:cover;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.card{overflow:hidden}.thumbs{display:grid;grid-template-columns:repeat(2,1fr);gap:2px}.thumbs img{width:100%;height:120px;object-fit:cover}.body{padding:14px}.body h3{margin:0 0 5px}.body small{color:#667085}.body button{margin-top:10px}.empty{text-align:center;color:#667085;padding:35px}.viewer{display:none;position:fixed;inset:0;background:#000e;z-index:20;align-items:center;justify-content:center;padding:15px}.viewer img{max-width:94%;max-height:80%;object-fit:contain}.close{position:absolute;top:8px;right:18px;color:white;font-size:40px}.nav{position:absolute;bottom:18px;display:flex;gap:10px}.count{position:absolute;bottom:65px;color:white}
</style></head>
<body><header><main><h1>📚 My Learning Library</h1><p>Save multiple screenshots for each thing you learn.</p></main></header>
<main><section class="panel"><h2>Add learning</h2>
<input id="title" placeholder="e.g. ETF NAV and AP arbitrage">
<select id="category"><option>Programming</option><option>Finance</option><option>AI</option><option>Trading</option><option>Other</option></select>
<label><b>Select screenshots — multiple allowed</b></label>
<input id="photos" type="file" accept="image/*" multiple>
<div id="preview" class="preview"></div><button id="save">➕ Save learning</button></section>
<section class="panel"><input id="search" placeholder="🔎 Search your learning..."><select id="filter"><option value="">All categories</option><option>Programming</option><option>Finance</option><option>AI</option><option>Trading</option><option>Other</option></select></section>
<div id="grid" class="grid"></div></main>
<div id="viewer" class="viewer"><div id="close" class="close">×</div><img id="big"><div id="count" class="count"></div><div class="nav"><button id="prev">← Previous</button><button id="next">Next →</button></div></div>
<script>
const DB="learning-library-v2";let db,items=[],current,pos=0;
let r=indexedDB.open(DB,1);r.onupgradeneeded=e=>e.target.result.createObjectStore("items",{keyPath:"id",autoIncrement:true});r.onsuccess=e=>{db=e.target.result;load()};
const st=(m="readonly")=>db.transaction("items",m).objectStore("items");function load(){st().getAll().onsuccess=e=>{items=e.target.result.sort((a,b)=>b.id-a.id);render()}}
photos.onchange=()=>{preview.innerHTML="";[...photos.files].forEach(f=>{let i=document.createElement("img");i.src=URL.createObjectURL(f);preview.appendChild(i)})};
save.onclick=()=>{let title=document.querySelector("#title").value.trim(),files=[...photos.files];if(!title||!files.length)return alert("Enter a name and select at least one screenshot.");let imgs=[],n=files.length;files.forEach(f=>{let x=new FileReader();x.onload=()=>{imgs.push(x.result);if(!--n)st("readwrite").add({title,category:category.value,images:imgs,date:new Date().toLocaleDateString()}).onsuccess=()=>{titleEl();load()}};x.readAsDataURL(f)})};
function titleEl(){document.querySelector("#title").value="";photos.value="";preview.innerHTML=""}
function render(){let q=search.value.toLowerCase(),f=filter.value,a=items.filter(x=>(!q||x.title.toLowerCase().includes(q))&&(!f||x.category==f));grid.innerHTML=a.length?a.map(x=>'<article class="card"><div class="thumbs">'+x.images.slice(0,4).map((im,n)=>`<img src="${im}" data-open="${x.id}" data-pos="${n}">`).join("")+'</div><div class="body"><h3>'+esc(x.title)+'</h3><small>'+esc(x.category)+' • '+x.images.length+' screenshot'+(x.images.length==1?'':'s')+'</small><br><button class="danger" data-del="'+x.id+'">Delete set</button></div></article>').join(""):'<div class="empty">No learning sets yet.</div>'}
search.oninput=render;filter.onchange=render;grid.onclick=e=>{let im=e.target.closest("[data-open]"),d=e.target.closest("[data-del]");if(im){current=items.find(x=>x.id==im.dataset.open);pos=+im.dataset.pos;show()}if(d&&confirm("Delete this learning set?"))st("readwrite").delete(+d.dataset.del).onsuccess=load};
function show(){big.src=current.images[pos];count.textContent=(pos+1)+" / "+current.images.length;viewer.style.display="flex"}prev.onclick=()=>{pos=(pos-1+current.images.length)%current.images.length;show()};next.onclick=()=>{pos=(pos+1)%current.images.length;show()};close.onclick=()=>viewer.style.display="none";function esc(s){let d=document.createElement("div");d.textContent=s;return d.innerHTML}render();
</script></body></html>
